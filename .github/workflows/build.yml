name: Build

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - java: 21
            profile: ""
          - java: 21
            profile: paper-1.21.11
          - java: 25
            profile: paper-26.1
          - java: 25
            profile: paper-26.2
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven
      - name: Build and test
        shell: bash
        run: |
          if [ -n "${{ matrix.profile }}" ]; then
            mvn -B -ntp clean verify -P"${{ matrix.profile }}"
          else
            mvn -B -ntp clean verify
          fi
